<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración | Café Nocturno</title>
  <style>
    :root { --bg:#1b1410; --card:#2a1f18; --border:#3b2d22; --accent:#d9a066; --text:#f3e9dc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; width: 100%; max-width: 380px; text-align: center; }
    h1 { color: var(--accent); font-size: 1.7rem; margin-bottom: .3rem; }
    p.sub { opacity: .75; margin-bottom: 1.4rem; font-size: .95rem; }
    input { width: 100%; padding: .75rem; margin-bottom: .7rem; border-radius: 8px; border: 1px solid var(--border); background: #1b1410; color: var(--text); font-size: 1rem; font-family: inherit; }
    button { width: 100%; padding: .75rem; border: none; border-radius: 8px; background: var(--accent); color: #1b1410; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: inherit; }
    button:disabled { opacity: .6; }
    .err { color: #e0806c; margin-top: .9rem; min-height: 1.3em; font-size: .9rem; }
    .ok h1 { color: #8fd18c; }
    .secret { margin-top: 1rem; padding: 1rem; background: #1b1410; border-radius: 8px; font-family: monospace; word-break: break-all; }
    .note { margin-top: 1.2rem; opacity: .55; font-size: .75rem; }
    #ok { display: none; }
  </style>
</head>
<body>
  <div>
    <div class="box" id="login">
      <h1>☕ Café Nocturno</h1>
      <p class="sub">Panel de administración</p>
      <form id="f" autocomplete="off">
        <input id="u" placeholder="Usuario" required>
        <input id="p" type="password" placeholder="Contraseña" required>
        <button id="b" type="submit">Entrar</button>
      </form>
      <div class="err" id="e"></div>
    </div>
    <div class="box ok" id="ok">
      <h1>Acceso concedido</h1>
      <p class="sub">Bienvenido/a, administrador.</p>
      <p>Código de seguridad:</p>
      <div class="secret" id="flag"></div>
    </div>
    <p class="note" style="text-align:center">Web y personajes ficticios creados para una competición CTF.</p>
  </div>
  <script>
    var SALT = "EzlCWOb+N24TM6q8PCfefg==", IV = "KaL2TUMqUWvHb5T5", DATA = "6cw9Ufd6+ibZllTxiA87noDccSMzTZhQTcwN5PWDW00vNCe4CWsswiIOf2uHHZdWDZUT8Y2+";
    function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    document.getElementById("f").addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var btn = document.getElementById("b"), err = document.getElementById("e");
      btn.disabled = true; err.textContent = "";
      var user = document.getElementById("u").value.trim();
      var pass = document.getElementById("p").value;
      try {
        var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user + ":" + pass), "PBKDF2", false, ["deriveKey"]);
        var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: 100000, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
        document.getElementById("flag").textContent = new TextDecoder().decode(plain);
        document.getElementById("login").style.display = "none";
        document.getElementById("ok").style.display = "block";
      } catch (e) {
        err.textContent = "Usuario o contraseña incorrectos.";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
