<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu pedido | Café Nocturno</title>
  <style>
    :root { --bg:#1b1410; --card:#2a1f18; --border:#3b2d22; --accent:#d9a066; --text:#f3e9dc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    header { text-align: center; padding: 3rem 1rem 1rem; }
    header h1 { color: var(--accent); font-size: 2.2rem; letter-spacing: 2px; }
    nav { text-align: center; padding-bottom: 1.2rem; }
    nav a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--accent); }
    main { max-width: 560px; margin: 0 auto; padding: 0 1rem 3rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.8rem; }
    .card h2 { color: var(--accent); margin-bottom: 1rem; }
    .row { display: flex; justify-content: space-between; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid var(--border); }
    .row:last-of-type { border-bottom: none; }
    .row span:first-child { opacity: .7; }
    .row span:last-child { text-align: right; }
    .err h2 { color: #e0806c; }
    footer { text-align: center; opacity: .55; font-size: .85rem; padding: 2rem 1rem; }
  </style>
</head>
<body>
  <header><h1>☕ Café Nocturno</h1></header>
  <nav><a href="index.html">← Volver</a></nav>
  <main><div class="card" id="c"><h2>Cargando pedido…</h2></div></main>
  <footer>&copy; 2026 Café Nocturno · Web y personajes ficticios creados para una competición CTF</footer>
  <script>
    var c = document.getElementById("c");
    var id = new URLSearchParams(location.search).get("id");

    function fila(k, v) {
      var r = document.createElement("div"); r.className = "row";
      var a = document.createElement("span"); a.textContent = k;
      var b = document.createElement("span"); b.textContent = v;
      r.appendChild(a); r.appendChild(b); return r;
    }
    function error(msg) {
      c.className = "card err";
      c.innerHTML = "<h2>Pedido no encontrado</h2>";
      var p = document.createElement("p"); p.textContent = msg; c.appendChild(p);
    }

    if (!id || !/^[0-9]+$/.test(id)) {
      error("Indica un número de pedido válido.");
    } else {
      fetch("pedidos/" + id + ".json")
        .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function (o) {
          c.className = "card";
          c.innerHTML = "";
          var h = document.createElement("h2"); h.textContent = "Pedido nº " + o.id; c.appendChild(h);
          c.appendChild(fila("Cliente", o.cliente));
          c.appendChild(fila("Productos", o.productos.join(", ")));
          c.appendChild(fila("Total", o.total));
          c.appendChild(fila("Nota", o.nota));
        })
        .catch(function () { error("No existe ningún pedido con el número " + id + "."); });
    }
  </script>
</body>
</html>
